spring.application.name=atostech
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/atostech}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
logging.level.org.springframework.security=DEBUG

spring.origin=${SPRING_ORIGIN:http://localhost:4200}

spring.local.save.course=${SPRING_COURSE_DIR:course/}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

